<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../fonts.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Keep Notes - T0151 G.P Mérida</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SDK de Supabase v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            accent: '#0d9488'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body { overscroll-behavior-y: contain; }
        -webkit-tap-highlight-color: transparent;
        body { user-select: none; -webkit-user-select: none; }
        input, select, textarea, [contenteditable] { user-select: text; -webkit-user-select: text; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        body, .card, .topbar, input, select, button {
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
        /* Estilos visuales para H1 y H2 en notas y vistas */
        .note-card h1, #verNotaContenido h1, #inputContenido h1 { font-size: 1.2rem; font-weight: bold; line-height: 1.3; margin: 0.2rem 0; }
        .note-card h2, #verNotaContenido h2, #inputContenido h2 { font-size: 1.1rem; font-weight: bold; line-height: 1.3; margin: 0.2rem 0; }

        /* Estilo Masonry Keep Grid - Forzado a 2 columnas en móviles y más en pantallas grandes */
        .notes-grid {
            column-count: 2;
            column-gap: 0.5rem;
        }
        @media (min-width: 640px) { .notes-grid { column-count: 2; column-gap: 0.75rem; } }
        @media (min-width: 1024px) { .notes-grid { column-count: 3; column-gap: 0.75rem; } }
        @media (min-width: 1280px) { .notes-grid { column-count: 4; column-gap: 0.75rem; } }
        .note-card {
            break-inside: avoid;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col font-sans overflow-hidden antialiased">
    <div class="main-content flex-1 flex flex-col overflow-y-auto">
        
        <!-- Topbar -->
        <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700/60 px-3 py-2 flex items-center justify-between shrink-0 z-50">
            <div class="flex items-center space-x-2.5">
                <div class="p-1.5 bg-teal-500/10 rounded-xl border border-teal-500/20 text-teal-600 shadow-md dark:text-teal-400">
                    <i data-lucide="sticky-note" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight text-slate-900 dark:text-slate-100">Notas & Categorías</h1>
                    <p class="text-[11px] text-teal-600 dark:text-teal-400 flex items-center gap-1 font-medium">
                        <span class="w-1.5 h-1.5 rounded-full bg-teal-500 dark:bg-teal-400 inline-block"></span> Keep Sub-Web - T0151
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <!-- Widget de reloj -->
                <div class="flex flex-col items-end px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/60 text-right">
                    <span id="liveClock" class="text-xs font-mono font-semibold text-teal-700 dark:text-teal-300">00:00:00</span>
                    <span id="liveDate" class="text-[9px] text-slate-500 dark:text-slate-400 uppercase tracking-wider">--,--</span>
                </div>
                <!-- Dark / Light Toggle -->
                <button id="btn-theme-toggle" class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 transition-colors" title="Cambiar modo">
                    <i id="theme-icon" data-lucide="moon" class="w-3.5 h-3.5 dark-icon"></i>
                    <i data-lucide="sun" class="w-3.5 h-3.5 light-icon hidden"></i>
                </button>
            </div>
        </header>

        <!-- Contenido Principal -->
        <div class="p-3 max-w-7xl mx-auto w-full space-y-4 flex-1 relative z-10">
            
            <!-- Barra de Acciones, Filtros y Estado Offline -->

                        <span id="conexionStatus" class="inline-flex items-center gap-1 text-[11px] text-amber-500"><i class="fa-solid fa-circle-dot"></i> Conectando...</span>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                        <button onclick="abrirModalCategoria()" class="py-1.5 px-3 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition-all font-semibold text-xs shadow-sm flex items-center justify-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-folder-plus text-teal-600"></i> Categorías
                        </button>
                        <button onclick="abrirModalNota()" class="py-1.5 px-3 bg-teal-500/10 border border-teal-500/30 text-teal-600 dark:text-teal-400 rounded-lg hover:bg-teal-500/20 transition-all font-semibold text-xs shadow-md flex items-center justify-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-plus"></i> Nueva Nota

                    <!-- Buscador -->
                    <div class="relative">

            <div class="mt-4 flex justify-end">
                <button onclick="cerrarModalVerNota()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold rounded-xl text-xs cursor-pointer">Cerrar</button>
            </div>

    <!-- Modal Crear / Editar Nota -->
    <div class="modal fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[10000] flex items-center justify-center p-4" id="modalNota" style="display: none;">
        <div class="modal-content bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-5 w-full max-w-md shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">

                            <span id="text_inputCategoria" class="truncate">Sin categoría</span> <i class="fa-solid fa-chevron-down" style="font-size: 9px; margin-left: 2px;"></i>

                        <button type="button" onclick="seleccionarColorNota('slate')" class="w-6 h-6 rounded-full bg-slate-200 dark:bg-slate-600 border-2 border-transparent hover:scale-110 transition-transform shadow-sm" data-color="slate" title="Gris"></button>

                        <button type="button" onclick="seleccionarColorNota('emerald')" class="w-6 h-6 rounded-full bg-emerald-100 dark:bg-emerald-950/60 border-2 border-transparent hover:scale-110 transition-transform shadow-sm" data-color="emerald" title="Verde"></button>
                        <button type="button" onclick="seleccionarColorNota('teal')" class="w-6 h-6 rounded-full bg-teal-100 dark:bg-teal-950/60 border-2 border-transparent hover:scale-110 transition-transform shadow-sm" data-color="teal" title="Teal"></button>
                        <button type="button" onclick="seleccionarColorNota('rose')" class="w-6 h-6 rounded-full bg-rose-100 dark:bg-rose-950/60 border-2 border-transparent hover:scale-110 transition-transform shadow-sm" data-color="rose" title="Rosa"></button>

            </div>
            <div class="mt-4 flex justify-end gap-2">
                <button onclick="cerrarModalNota()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold rounded-xl text-xs">Cancelar</button>

    <!-- Modal Gestionar Categorías -->

        <div class="modal-content bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">

    <!-- Modal Alerta -->

            </div>
        </div>

    <script>
        // -------------------------------------------------------------
        // CONFIGURACIÓN SUPABASE & CACHÉ LOCAL
        // -------------------------------------------------------------
        const SUPABASE_URL = "https://mifbcyxtafeacwkzqzsq.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_O6EAbkSba1NQPq08k_7bHg_PZ_x4ZU5";
        const NOTAS_CACHE_KEY = 'keep_notes_cache_data';
        const CATEGORIAS_CACHE_KEY = 'keep_categories_cache_data';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let notasData = [];
        let categoriasData = [];

        // Tema Oscuro / Claro
        const btnThemeToggle = document.getElementById('btn-theme-toggle');
        const htmlElement = document.documentElement;
        function setTheme(isDark) {
            if (isDark) {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
            lucide.createIcons();
        }
        const savedTheme = localStorage.getItem('theme');
        setTheme(savedTheme !== 'light');
        btnThemeToggle.addEventListener('click', () => {
            setTheme(!htmlElement.classList.contains('dark'));
        });
        lucide.createIcons();

        // Control de Menús Desplegables Custom
        window.onclick = function(event) {
            if (!event.target.closest('.dropdown')) {
                const dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (!openDropdown.classList.contains('hidden')) openDropdown.classList.add('hidden');
                }
            }
        }
        function toggleDropdown(event, dropdownId) {
            event.stopPropagation();
            const dropdowns = document.getElementsByClassName("dropdown-content");
            for (let i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].id !== dropdownId) dropdowns[i].classList.add('hidden');
            }
            document.getElementById(dropdownId).classList.toggle('hidden');
        }
        function seleccionarOpcionDropdown(inputId, spanId, menuId, valor, labelTexto) {
            const input = document.getElementById(inputId);
            const span = document.getElementById(spanId);
            if (input && span) {
                input.value = valor;
                span.textContent = labelTexto;
                input.dispatchEvent(new Event('change'));
            }
            document.getElementById(menuId).classList.add('hidden');
        }

        // Reloj en vivo
        function initClock() {
            const updateClock = () => {
                const now = new Date();

        // -------------------------------------------------------------
        // OFFLINE-FIRST QUEUE & SYNC
        // -------------------------------------------------------------
        function obtenerColaPendiente() { return JSON.parse(localStorage.getItem('cola_keep_offline') || '[]'); }
        function guardarColaPendiente(cola) { localStorage.setItem('cola_keep_offline', JSON.stringify(cola)); }
        
        function agregarAColaOffline(accion, tipo, payload) {
            const cola = obtenerColaPendiente();
            cola.push({ idTemp: Date.now(), accion, tipo, payload });
            guardarColaPendiente(cola);
            actualizarEstadoConexionUI();
        }

        function actualizarEstadoConexionUI() {
            const statusEl = document.getElementById('conexionStatus');
            const cola = obtenerColaPendiente();
            if (!navigator.onLine) {
                statusEl.className = "inline-flex items-center gap-1 text-[11px] text-amber-500 font-bold";
                statusEl.innerHTML = `<i class="fa-solid fa-wifi"></i> Sin Conexión (${cola.length} pendientes)`;
            } else if (cola.length > 0) {
                statusEl.className = "inline-flex items-center gap-1 text-[11px] text-amber-500 font-bold animate-pulse";
                statusEl.innerHTML = `<i class="fa-solid fa-arrows-rotate fa-spin"></i> Sincronizando (${cola.length})...`;
            } else {
                statusEl.className = "inline-flex items-center gap-1 text-[11px] text-emerald-500 font-semibold";
                statusEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> Base de Datos: En Línea`;
            }
        }

        async function procesarSincronizacionOffline() {
            const cola = obtenerColaPendiente();
            if (cola.length === 0 || !navigator.onLine) return;
            const colaFallida = [];

            for (const item of cola) {
                let error = null;
                const tabla = item.tipo === 'NOTA' ? 'notas' : 'categorias';

                if (item.accion === 'CREAR') {
                    const { id, ...data } = item.payload;
                    const { error: err } = await supabaseClient.from(tabla).insert([data]);
                    error = err;
                } else if (item.accion === 'EDITAR') {
                    const { error: err } = await supabaseClient.from(tabla).update(item.payload).eq('id', item.payload.id);
                    error = err;
                } else if (item.accion === 'ELIMINAR') {
                    const { error: err } = await supabaseClient.from(tabla).delete().eq('id', item.payload.id);
                    error = err;
                }
                if (error) colaFallida.push(item);
            }
            guardarColaPendiente(colaFallida);
            actualizarEstadoConexionUI();
            if (colaFallida.length === 0 && cola.length > 0) {
                mostrarAlerta('¡Cambios locales sincronizados con éxito!');
            }
            await cargarDatosRemotos();
        }

        window.addEventListener('online', () => { procesarSincronizacionOffline(); });
        window.addEventListener('offline', () => { actualizarEstadoConexionUI(); });

        // -------------------------------------------------------------
        // CARGA Y OPERACIONES DE DATOS
        // -------------------------------------------------------------
        window.onload = async function() {
            initClock();
            
            // 1. Cargar caché local instantánea
            const cacheNotas = localStorage.getItem(NOTAS_CACHE_KEY);
            const cacheCats = localStorage.getItem(CATEGORIAS_CACHE_KEY);
            if (cacheCats) categoriasData = JSON.parse(cacheCats);
            if (cacheNotas) notasData = JSON.parse(cacheNotas);

            populateSelectsCategorias();
            aplicarFiltrosLocales();

            // 2. Sincronizar y obtener datos frescos si hay red
            if (navigator.onLine) {
                await procesarSincronizacionOffline();
                await cargarDatosRemotos();
            } else {
                actualizarEstadoConexionUI();
            }
        };

        async function actualizarDatosManual() {
            const icono = document.getElementById('iconActualizar');
            if (icono) icono.classList.add('fa-spin');
            if (navigator.onLine) {
                await procesarSincronizacionOffline();
            }
            await cargarDatosRemotos();
            if (icono) {
                setTimeout(() => icono.classList.remove('fa-spin'), 500);
            }
        }

        async function cargarDatosRemotos() {
            if (!navigator.onLine) {
                aplicarFiltrosLocales();
                return;
            }
            // Obtener Categorías
            const resCats = await supabaseClient.from('categorias').select('*').order('nombre', { ascending: true });
            if (!resCats.error) {
                categoriasData = resCats.data || [];
                localStorage.setItem(CATEGORIAS_CACHE_KEY, JSON.stringify(categoriasData));
            }

            // Obtener Notas
            const resNotas = await supabaseClient.from('notas').select('*').order('created_at', { ascending: false });
            if (!resNotas.error) {
                notasData = resNotas.data || [];
                localStorage.setItem(NOTAS_CACHE_KEY, JSON.stringify(notasData));
            } else {
                console.error("Error al obtener notas:", resNotas.error);
            }

            populateSelectsCategorias();
            aplicarFiltrosLocales();
            actualizarEstadoConexionUI();
        }

        async function guardarNota() {
            const editId = document.getElementById('editNotaId').value;
            const titulo = document.getElementById('inputTitulo').value.trim();
            const contenido = document.getElementById('inputContenido').innerHTML.trim();
            let categoria_id = document.getElementById('inputCategoriaId').value.trim();
            const color_nota = document.getElementById('inputColorNota').value || 'default';
            if (!categoria_id) categoria_id = null;

            if (!titulo && (!contenido || contenido === '<br>')) {
                mostrarAlerta('La nota debe tener un título o algún contenido.');
                return;
            }

            const payload = {
                titulo: titulo || 'Sin título',
                contenido,
                categoria_id,
                color_nota,
                updated_at: new Date().toISOString()
            };

            if (!navigator.onLine) {
                if (editId) {
                    payload.id = editId;
                    agregarAColaOffline('EDITAR', 'NOTA', payload);
                    const idx = notasData.findIndex(n => n.id == editId);
                    if (idx !== -1) notasData[idx] = { ...notasData[idx], ...payload };
                } else {
                    payload.id = 'temp_' + Date.now();
                    payload.created_at = new Date().toISOString();
                    agregarAColaOffline('CREAR', 'NOTA', payload);
                    notasData.unshift(payload);
                }
                localStorage.setItem(NOTAS_CACHE_KEY, JSON.stringify(notasData));
                aplicarFiltrosLocales();
                cerrarModalNota();
                return;
            }

            try {
                if (editId) {
                    const { error } = await supabaseClient.from('notas').update(payload).eq('id', editId);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient.from('notas').insert([payload]);
                    if (error) throw error;
                }
            } catch (err) {
                console.error("Error al guardar nota online, guardando offline:", err);
                if (editId) {
                    payload.id = editId;
                    agregarAColaOffline('EDITAR', 'NOTA', payload);
                    const idx = notasData.findIndex(n => n.id == editId);
                    if (idx !== -1) notasData[idx] = { ...notasData[idx], ...payload };
                } else {
                    payload.id = 'temp_' + Date.now();
                    payload.created_at = new Date().toISOString();
                    agregarAColaOffline('CREAR', 'NOTA', payload);
                    notasData.unshift(payload);
                }
                localStorage.setItem(NOTAS_CACHE_KEY, JSON.stringify(notasData));
                aplicarFiltrosLocales();
                cerrarModalNota();
                return;
            }

            await cargarDatosRemotos();
            cerrarModalNota();
        }

        function eliminarNota(id) {
            mostrarConfirmacion('¿Desea eliminar esta nota?', async (aceptado) => {
                if (!aceptado) return;
                if (!navigator.onLine) {
                    agregarAColaOffline('ELIMINAR', 'NOTA', { id });
                    notasData = notasData.filter(n => n.id != id);
                    localStorage.setItem(NOTAS_CACHE_KEY, JSON.stringify(notasData));
                    aplicarFiltrosLocales();
                    return;
                }
                try {
                    const { error } = await supabaseClient.from('notas').delete().eq('id', id);
                    if (error) throw error;
                } catch (err) {
                    agregarAColaOffline('ELIMINAR', 'NOTA', { id });
                    notasData = notasData.filter(n => n.id != id);
                    localStorage.setItem(NOTAS_CACHE_KEY, JSON.stringify(notasData));
                    aplicarFiltrosLocales();
                    return;
                }
                await cargarDatosRemotos();
            });
        }

        async function toggleFavorito(id) {
            const nota = notasData.find(n => n.id == id);
            if (!nota) return;
            const nuevoFav = !nota.favorito;
            nota.favorito = nuevoFav;
            
            if (!navigator.onLine) {
                agregarAColaOffline('EDITAR', 'NOTA', { id, favorito: nuevoFav });
                localStorage.setItem(NOTAS_CACHE_KEY, JSON.stringify(notasData));
                aplicarFiltrosLocales();

        async function crearCategoria() {
            const input = document.getElementById('nuevaCategoriaNombre');
            const nombre = input.value.trim();
            if (!nombre) { mostrarAlerta('Escribe el nombre de la categoría.'); return; }
            
            const payload = { nombre };
            if (!navigator.onLine) {
                payload.id = 'temp_cat_' + Date.now();
                agregarAColaOffline('CREAR', 'CATEGORIA', payload);
                categoriasData.push(payload);
                localStorage.setItem(CATEGORIAS_CACHE_KEY, JSON.stringify(categoriasData));
                input.value = '';
                renderizarListaCategoriasModal();

                    aplicarFiltrosLocales();

        // --- RENDERIZADO Y FILTRADO ESTILO KEEP ---
        function obtenerClasesColorNota(color) {
            switch(color) {
                case 'slate':
                    return 'bg-slate-200/80 dark:bg-slate-700/70 border-slate-300 dark:border-slate-600';
                case 'amber':
                    return 'bg-amber-50 dark:bg-amber-950/40 border-amber-200 dark:border-amber-800/60';
                case 'emerald':
                    return 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800/60';
                case 'teal':
                    return 'bg-teal-50 dark:bg-teal-950/40 border-teal-200 dark:border-teal-800/60';
                case 'rose':
                    return 'bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-800/60';
                default:
                    return 'bg-white dark:bg-slate-800/80 border-slate-200 dark:border-slate-700/80';
            }
        }

                    <div class="pt-2 border-t border-slate-200/50 dark:border-slate-700/50 flex items-center justify-between text-[10px]">
                        <span class="px-2 py-0.5 rounded-full font-semibold bg-teal-500/10 text-teal-600 dark:text-teal-400 border border-teal-500/20 truncate max-w-[90px]">${nombreCat}</span>
                        <div class="flex items-center gap-1 opacity-90 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="abrirModalVerNota('${nota.id}')" class="p-1 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition-colors" title="Ver / Maximizar nota"><i class="fa-solid fa-expand"></i></button>
                            <button onclick="abrirModalNota('${nota.id}')" class="p-1 text-teal-600 hover:text-teal-800 dark:text-teal-400 transition-colors" title="Editar nota"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="eliminarNota('${nota.id}')" class="p-1 text-rose-500 hover:text-rose-700 transition-colors" title="Eliminar nota"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function aplicarFiltrosLocales() {
            const textoBuscador = document.getElementById('filtroBuscador').value.trim().toLowerCase();
            const filtroCat = document.getElementById('filtroCategoria').value;

            let filtrados = notasData;
            if (filtroCat === 'sin_categoria') {
                filtrados = filtrados.filter(n => !n.categoria_id);
            } else if (filtroCat) {
                filtrados = filtrados.filter(n => n.categoria_id === filtroCat);
            }

            if (textoBuscador) {
                filtrados = filtrados.filter(n =>
                    (n.titulo && n.titulo.toLowerCase().includes(textoBuscador)) ||
                    (n.contenido && n.contenido.toLowerCase().includes(textoBuscador))
                );
            }
            renderizarNotas(filtrados);
            actualizarEstadoConexionUI();
        }

        function filtrarNotas() {
            aplicarFiltrosLocales();
        }
    </script>
</body>
</html>
