<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Board Hub</title>
    
    <!-- Soporte PWA e iOS -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FZBoard Hub">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Dashboard centralizador de proyectos web y PWAs">
    <link rel="manifest" href="manifest.json" id="manifestLink">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            accent: '#0d9488'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        html, body {
            overscroll-behavior-y: contain;
        }
        -webkit-tap-highlight-color: transparent;
        body { user-select: none; -webkit-user-select: none; }
        input, select, textarea { user-select: text; -webkit-user-select: text; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }

        /* --- TRANSICIÓN FLUIDA  --- */
        .view-transition {
            position: fixed;
            inset: 0;
            z-index: 10050;
            background-color: #0f172a; /* Fondo sólido para ocultar el index de fondo */
            transform: translateX(100%);
            opacity: 0;
            visibility: hidden;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease, visibility 0.35s;
        }

        .view-transition.active {
            transform: translateX(0);
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col font-sans overflow-hidden antialiased transition-colors duration-200">

    <!-- Header / Navbar -->
    <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700/60 px-3 py-2 flex items-center justify-between shrink-0 z-10">
        <div class="flex items-center space-x-2.5">
            <div class="p-1.5 bg-teal-500/10 rounded-xl border border-teal-500/20 text-teal-600 dark:text-teal-400">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight text-slate-900 dark:text-slate-100 flex items-center gap-2">
                    FZ Board Hub
                </h1>
                <p class="text-[11px] text-teal-600 dark:text-teal-400 flex items-center gap-1 font-medium">
                    <span class="w-1.5 h-1.5 rounded-full bg-teal-500 dark:bg-teal-400 inline-block"></span> Mis Proyectos
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Dark / Light Toggle -->
            <button id="themeToggle" class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 transition-colors" title="Cambiar modo">
                <i data-lucide="moon" class="w-3.5 h-3.5 dark-icon"></i>
                <i data-lucide="sun" class="w-3.5 h-3.5 light-icon hidden"></i>
            </button>

            <!-- Widget de reloj-->
            <div class="flex flex-col items-end px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/60 text-right">
                <span id="liveClock" class="text-xs font-mono font-semibold text-teal-700 dark:text-teal-300">00:00:00</span>
                <span id="liveDate" class="text-[9px] text-slate-500 dark:text-slate-400 uppercase tracking-wider">--,--</span>
            </div>

            <!-- Botón Instalar PWA 
            <button id="installBtn" class="hidden sm:flex items-center gap-1 px-2.5 h-7 rounded-full bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 text-[11px] shadow-md font-semibold transition-colors">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span>Instalar</span>
            </button>  -->

            <!-- Botón proyecto nuevo-->
            <button id="openAddModalBtn" class="flex items-center gap-1 px-2.5 h-7 rounded-full bg-teal-500/10 hover:bg-teal-500/20 border border-teal-500/30 text-teal-600 dark:text-teal-400 text-[11px] shadow-md font-semibold transition-colors cursor-pointer">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">Agregar</span>
            </button>
        </div>
    </header>

    <!-- Contenido principal del cuerpo -->
    <main class="flex-1 overflow-y-auto p-3 relative max-w-7xl mx-auto w-full space-y-3 flex flex-col">

        <!-- Barra de buscar y Filtros de categoría -->
        <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 rounded-xl p-3 shadow-md flex flex-col sm:flex-row gap-2.5 items-center justify-between shrink-0">
            <div class="relative w-full sm:w-72">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Buscar en mis proyectos..." 
                    class="w-full pl-9 pr-3 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700/50 text-xs text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-teal-500 transition-all font-medium">
            </div>

            <div class="flex items-center gap-1 overflow-x-auto w-full sm:w-auto" id="categoryFilters"></div> 
        </div>

        <!-- Dashboard Grid Layout -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3" id="projectsContainer"></div>

        <!-- Extra Useful Widgets Panel -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-1 shrink-0">
            <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 rounded-xl p-3 shadow-md md:col-span-2 flex flex-col justify-between">
                <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-200 dark:border-slate-700/60">
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="sticky-note" class="w-4 h-4 text-teal-600 dark:text-teal-400"></i>
                        <h3 class="text-xs font-bold text-slate-900 dark:text-slate-100 uppercase tracking-wider">Notas Rápidas & Pendientes</h3>
                    </div>
                    <span id="noteSavedBadge" class="text-[10px] text-teal-600 dark:text-teal-400 font-semibold opacity-0 transition-opacity">Guardado ✓</span>
                </div>
                <textarea id="quickNotes" placeholder="Escribe ideas o notas rápidas aquí..." 
                    class="w-full h-20 bg-slate-50 dark:bg-slate-900/40 rounded-lg p-2.5 text-xs text-slate-800 dark:text-slate-200 placeholder-slate-400 border border-slate-200 dark:border-slate-700/50 focus:outline-none focus:border-teal-500 resize-none transition-all"></textarea>
            </div>
             
                <!-- Stats & Quick Links Widget 
            <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 rounded-xl p-3 shadow-md flex flex-col justify-between">
                <div class="flex items-center gap-1.5 pb-2 mb-2 border-b border-slate-200 dark:border-slate-700/60">
                    <i data-lucide="bookmark" class="w-4 h-4 text-teal-600 dark:text-teal-400"></i>
                    <h3 class="text-xs font-bold text-slate-900 dark:text-slate-100 uppercase tracking-wider">Accesos Externos</h3> 
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <a href="https://github.com/jesusfritz-cmyk" target="_blank" class="p-2 rounded-lg bg-slate-50 dark:bg-slate-900/40 hover:bg-slate-100 dark:hover:bg-slate-900 border border-slate-200 dark:border-slate-700/50 text-slate-700 dark:text-slate-300 flex items-center gap-1.5 transition-colors font-medium">
                        <i data-lucide="cat" class="w-3.5 h-3.5 text-teal-600 dark:text-teal-400"></i>
                        <span>GitHub</span>
                    </a>
                    <a href="https://lucide.dev/icons/" target="_blank" class="p-2 rounded-lg bg-slate-50 dark:bg-slate-900/40 hover:bg-slate-100 dark:hover:bg-slate-900 border border-slate-200 dark:border-slate-700/50 text-slate-700 dark:text-slate-300 flex items-center gap-1.5 transition-colors font-medium">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-teal-600 dark:text-teal-400"></i>
                        <span>Lucide Icons</span>
                    </a>
                    <a href="https://netlify.com" target="_blank" class="p-2 rounded-lg bg-slate-50 dark:bg-slate-900/40 hover:bg-slate-100 dark:hover:bg-slate-900 border border-slate-200 dark:border-slate-700/50 text-slate-700 dark:text-slate-300 flex items-center gap-1.5 transition-colors font-medium">
                        <i data-lucide="globe" class="w-3.5 h-3.5 text-teal-600 dark:text-teal-400"></i>
                        <span>Netlify</span>
                    </a>
                    <a href="https://codepen.io" target="_blank" class="p-2 rounded-lg bg-slate-50 dark:bg-slate-900/40 hover:bg-slate-100 dark:hover:bg-slate-900 border border-slate-200 dark:border-slate-700/50 text-slate-700 dark:text-slate-300 flex items-center gap-1.5 transition-colors font-medium">
                        <i data-lucide="code-2" class="w-3.5 h-3.5 text-teal-600 dark:text-teal-400"></i>
                        <span>CodePen</span>
                    </a> 
                </div> --> 
            </div>
        </div> 
    </main>

    <!-- Modal: Add / Edit Project -->
    <div id="projectModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">
                <div class="flex items-center gap-2 text-slate-900 dark:text-slate-100 font-bold text-base" id="modalTitle">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-teal-500"></i>
                    <span>Agregar Proyecto</span>
                </div>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="projectForm" class="space-y-3">
                <input type="hidden" id="projectId">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Título del Proyecto *</label>
                    <input type="text" id="projectTitle" required placeholder="Ej: Ventas Diarias" 
                        class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-teal-500 font-medium">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">URL *</label>
                    <input type="text" id="projectUrl" required placeholder=" " 
                        class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-teal-500 font-medium">
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Categoría</label>
                        <select id="projectCategory" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-teal-500 font-medium">
                            <option value="pwa">N/A</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Icono (Emoji o Lucide)</label>
                        <input type="text" id="projectIcon" placeholder="🚀 o 'globe'" 
                            class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-teal-500 font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Descripción Breve</label>
                    <textarea id="projectDesc" rows="2" placeholder="Notas breves del proyecto..." 
                        class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-teal-500 resize-none font-medium"></textarea>
                </div>
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="projectEmbed" class="rounded bg-slate-50 dark:bg-slate-900 border-slate-300 dark:border-slate-700 text-teal-600 focus:ring-0" checked>
                    <label for="projectEmbed" class="text-xs font-medium text-slate-700 dark:text-slate-300">Abrir en PWA</label>
                </div>
                <div class="pt-2 flex gap-2 justify-end">
                    <button type="button" id="cancelModalBtn" class="px-3.5 py-2 bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 rounded-xl hover:bg-red-500/20 transition-all font-semibold text-xs shadow-md transition-colors">Cancelar</button>
                    <button type="submit" class="w-full py-1.5 rounded-lg bg-teal-500/10 hover:bg-teal-500/20 text-teal-600 dark:text-teal-400 border border-teal-500/30 text-xs shadow-md  font-semibold flex items-center justify-center gap-1.5 transition-colors cursor-pointer">Guardar Proyecto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmación para Eliminar Proyecto -->
    <div id="confirmDeleteModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-[10005] flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl text-center space-y-4">
            <div class="w-10 h-10 bg-rose-500/10 border border-rose-500/20 text-rose-500 rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="alert-triangle" class="w-5 h-5"></i>
            </div>
            <p class="text-xs font-semibold text-slate-700 dark:text-slate-200 leading-relaxed">
                ¿Seguro que deseas eliminar este proyecto de tu lista?
            </p>
            <div class="flex gap-2">
                <button onclick="cerrarConfirmacionEliminar()" class="flex-1 py-2 bg-teal-500/10 border border-teal-500/30 text-teal-600 dark:text-teal-400 rounded-lg hover:bg-teal-500/20 transition-all font-semibold text-xs shadow-md  transition-colors">
                    Cancelar
                </button>
                <button onclick="ejecutarEliminacionProyecto()" class="flex-1 py-2 bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 rounded-xl hover:bg-red-500/20 transition-all font-semibold  text-xs shadow-md ">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <!-- --- VISTA DESLIZANTE DE PANTALLA COMPLETA --- -->
    <div id="iframeModal" class="view-transition flex flex-col">
        <!-- Barra superior de navegación de la subpágina -->
        <div class="flex items-center justify-between px-4 py-3 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-md shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="cerrarIframeAnimado()" class="flex items-center gap-1.5 px-3 py-1.5 bg-teal-500/10 hover:bg-teal-500/20 border border-teal-500/30 text-teal-600 dark:text-teal-400 font-bold text-xs rounded-xl transition-colors cursor-pointer">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Volver al Hub</span>
                </button>
                <span id="iframeTitle" class="text-xs sm:text-sm font-bold text-slate-900 dark:text-white truncate max-w-[180px] sm:max-w-xs">Vista Previa</span> 
            </div>
            <a id="iframeExternalLink" href="#" target="_blank" class="text-xs text-slate-500 dark:text-slate-400 hover:text-teal-600 dark:hover:text-teal-400 flex items-center gap-1 font-semibold transition-colors">
                <span class="hidden sm:inline">Pestaña nueva</span> 
                <i data-lucide="external-link" class="w-4 h-4"></i> 
            </a>
        </div>
        <!-- Contenedor estricto del Iframe -->
        <div class="flex-1 w-full h-full bg-slate-900 relative">
            <iframe id="pwaIframe" class="w-full h-full border-0 block" src="about:blank"></iframe>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // Arreglo inicial vacío para que comience sin proyectos preguardados
        let projects = JSON.parse(localStorage.getItem('fzboard_projects')) || [];
        let activeCategory = 'all';
        let deferredPrompt = null;
        let projectToDeleteId = null;

        function formatUrl(url) {
            if (!url) return '#';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            return url;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProjects();
            initClock();
            initNotes();
            initTheme();
            initPwaInstaller();
            lucide.createIcons();
        });

        function renderProjects() {
            const container = document.getElementById('projectsContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = projects.filter(p => {
                const matchesCat = activeCategory === 'all' || p.category === activeCategory;
                const matchesSearch = p.title.toLowerCase().includes(searchTerm) || 
                                     p.desc.toLowerCase().includes(searchTerm);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full p-8 text-center bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 rounded-xl shadow-md">
                        <i data-lucide="folder-open" class="w-10 h-10 text-slate-400 mx-auto mb-2"></i>
                        <p class="text-sm font-bold text-slate-800 dark:text-slate-200">No se encontraron proyectos guardados.</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Haz clic en "+" para incorporar uno nuevo.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = filtered.map(p => {
                const formattedUrl = formatUrl(p.url);
                const isEmoji = p.icon && p.icon.match(/\p{Extended_Pictographic}/u);
                
                return `
                    <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 rounded-xl p-3 shadow-md flex flex-col justify-between group hover:border-teal-500/50 transition-all duration-200">
                        <div>
                            <div class="flex items-start justify-between mb-2">
                                <div class="w-9 h-9 rounded-lg bg-teal-500/10 border border-teal-500/20 flex items-center justify-center text-teal-600 dark:text-teal-400">
                                    ${isEmoji ? `<span class="text-lg">${p.icon}</span>` : `<i data-lucide="${p.icon || 'globe'}" class="w-4 h-4"></i>`}
                                </div>
                                <div class="flex items-center gap-1">
                                  <button onclick="editProject('${p.id}')" class="p-1 rounded-lg text-slate-400 hover:text-teal-600 dark:hover:text-teal-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" title="Editar">
                                        <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                                    </button> 
                                  <button onclick="deleteProject('${p.id}')" class="p-1 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" title="Eliminar">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    </button> 
                                </div>
                            </div>
                            <h3 class="text-xl font-bold text-slate-900 dark:text-slate-100 group-hover:text-teal-600 dark:group-hover:text-teal-400 transition-colors truncate">${p.title}</h3>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-snug">${p.desc || 'Sin descripción'}</p>
                        </div>
                        <div class="pt-2.5 mt-2.5 border-t border-slate-200 dark:border-slate-700/60 flex items-center justify-between">
                            ${p.embed ? `
                                <button onclick="openIframeAnimado('${formattedUrl}', '${p.title.replace(/'/g, "\\'")}')" class="w-full py-1.5 rounded-lg bg-teal-500/10 hover:bg-teal-500/20 text-teal-600 dark:text-teal-400 border border-teal-500/30 text-xs shadow-md font-semibold flex items-center justify-center gap-1.5 transition-colors cursor-pointer">
                                    <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i> Abrir App
                                </button>
                            ` : `
                                <a href="${formattedUrl}" target="_blank" class="w-full py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors shadow-sm">
                                    <span>Abrir</span>
                                    <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
                                </a>
                            `}
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // Live Clock
        function initClock() {
            const updateClock = () => {
                const now = new Date();
                document.getElementById('liveClock').textContent = now.toLocaleTimeString();
                document.getElementById('liveDate').textContent = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
            };
            updateClock();
            setInterval(updateClock, 1000);
        }

        // Quick Notes Autosave
        function initNotes() {
            const textarea = document.getElementById('quickNotes');
            const badge = document.getElementById('noteSavedBadge');
            textarea.value = localStorage.getItem('fzboard_notes') || '';

            let timeout;
            textarea.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    localStorage.setItem('fzboard_notes', textarea.value);
                    badge.classList.remove('opacity-0');
                    setTimeout(() => badge.classList.add('opacity-0'), 1500);
                }, 500);
            });
        }

        // Theme Toggle
        const btnThemeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        function setTheme(isDark) {
            if (isDark) {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
            lucide.createIcons();
        }

        const savedTheme = localStorage.getItem('theme');
        setTheme(savedTheme !== 'light');

        btnThemeToggle.addEventListener('click', () => {
            const isDarkActive = htmlElement.classList.contains('dark');
            setTheme(!isDarkActive);
        });

        // Modal Handlers
        const modal = document.getElementById('projectModal');
        const form = document.getElementById('projectForm');

        document.getElementById('openAddModalBtn').addEventListener('click', () => {
            form.reset();
            document.getElementById('projectId').value = '';
            document.getElementById('modalTitle').innerHTML = '<i data-lucide="plus-circle" class="w-5 h-5 text-teal-500"></i><span>Agregar Proyecto</span>';
            modal.classList.remove('hidden');
            lucide.createIcons();
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.add('hidden'));
        document.getElementById('cancelModalBtn').addEventListener('click', () => modal.classList.add('hidden'));

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('projectId').value || Date.now().toString();
            const newProject = {
                id,
                title: document.getElementById('projectTitle').value,
                url: document.getElementById('projectUrl').value,
                category: document.getElementById('projectCategory').value,
                icon: document.getElementById('projectIcon').value || 'globe',
                desc: document.getElementById('projectDesc').value,
                embed: document.getElementById('projectEmbed').checked
            };

            const index = projects.findIndex(p => p.id === id);
            if (index > -1) {
                projects[index] = newProject;
            } else {
                projects.unshift(newProject);
            }

            localStorage.setItem('fzboard_projects', JSON.stringify(projects));
            modal.classList.add('hidden');
            renderProjects();
        });

        window.editProject = (id) => {
            const p = projects.find(item => item.id === id);
            if (!p) return;

            document.getElementById('projectId').value = p.id;
            document.getElementById('projectTitle').value = p.title;
            document.getElementById('projectUrl').value = p.url;
            document.getElementById('projectCategory').value = p.category;
            document.getElementById('projectIcon').value = p.icon;
            document.getElementById('projectDesc').value = p.desc;
            document.getElementById('projectEmbed').checked = p.embed;

            document.getElementById('modalTitle').innerHTML = '<i data-lucide="pencil" class="w-5 h-5 text-teal-500"></i><span>Editar Proyecto</span>';
            modal.classList.remove('hidden');
            lucide.createIcons();
        };

        window.deleteProject = (id) => {
            projectToDeleteId = id;
            document.getElementById('confirmDeleteModal').classList.remove('hidden');
            lucide.createIcons();
        };

        function cerrarConfirmacionEliminar() {
            projectToDeleteId = null;
            document.getElementById('confirmDeleteModal').classList.add('hidden');
        }

        function ejecutarEliminacionProyecto() {
            if (projectToDeleteId) {
                projects = projects.filter(p => p.id !== projectToDeleteId);
                localStorage.setItem('fzboard_projects', JSON.stringify(projects));
                renderProjects();
            }
            cerrarConfirmacionEliminar();
        }

        // Filter Handlers
        document.getElementById('categoryFilters').addEventListener('click', (e) => {
            const btn = e.target.closest('.cat-btn');
            if (btn) {
                document.querySelectorAll('.cat-btn').forEach(b => {
                    b.classList.remove('bg-teal-600', 'text-white', 'shadow-sm');
                    b.classList.add('bg-slate-100', 'hover:bg-slate-200', 'dark:bg-slate-900/40', 'text-slate-600', 'dark:text-slate-400', 'border', 'border-slate-200', 'dark:border-slate-700/50');
                });
                btn.classList.remove('bg-slate-100', 'hover:bg-slate-200', 'dark:bg-slate-900/40', 'text-slate-600', 'dark:text-slate-400', 'border', 'border-slate-200', 'dark:border-slate-700/50');
                btn.classList.add('bg-teal-600', 'text-white', 'shadow-sm');
                
                activeCategory = btn.dataset.cat;
                renderProjects();
            }
        });

        document.getElementById('searchInput').addEventListener('input', renderProjects);

        // --- CONTROL DE TRANSICIONES FLUIDAS ---
        window.openIframeAnimado = (url, title) => {
            const viewModal = document.getElementById('iframeModal');
            const iframe = document.getElementById('pwaIframe');
            
            document.getElementById('iframeTitle').textContent = title;
            document.getElementById('iframeExternalLink').href = url;
            
            if (iframe.src !== url && !iframe.src.endsWith(url)) {
                iframe.src = url;
            }

            // Desliza la subpágina hacia la pantalla con animación fluida
            viewModal.classList.add('active');
        };

        window.cerrarIframeAnimado = () => {
            const viewModal = document.getElementById('iframeModal');
            
            // Oculta la subpágina deslizándola hacia la derecha
            viewModal.classList.remove('active');
        };

        // PWA Installation Hook
        function initPwaInstaller() {
            const installBtn = document.getElementById('installBtn');
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installBtn.classList.remove('hidden');
            });

            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        installBtn.classList.add('hidden');
                    }
                    deferredPrompt = null;
                }
            });
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Registration error:', err));
            });
        }
    </script>
</body>
</html>
