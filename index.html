<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Board TDA</title>
    
    <!-- Soporte PWA e iOS -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FZBoard TDA">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Dashboard centralizador de proyectos web y PWAs">
    <link rel="manifest" href="manifest.json" id="manifestLink">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            accent: '#0d9488'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        html, body {
            overscroll-behavior-y: contain;
        }
        -webkit-tap-highlight-color: transparent;
        body { user-select: none; -webkit-user-select: none; }
        input, select, textarea { user-select: text; -webkit-user-select: text; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }

        /* --- TRANSICIÓN FLUIDA --- */
        .view-transition {
            position: fixed;
            inset: 0;
            z-index: 10050;
            background-color: #0f172a;
            transform: translateX(100%);
            opacity: 0;
            visibility: hidden;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease, visibility 0.35s;
        }

        .view-transition.active {
            transform: translateX(0);
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col font-sans overflow-hidden antialiased transition-colors duration-200">

    <!-- Header / Navbar -->
    <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700/60 px-3 py-2 flex items-center justify-between shrink-0 z-10">
        <div class="flex items-center space-x-2.5">
            <div class="p-1.5 bg-teal-500/10 rounded-xl border border-teal-500/20 text-teal-600 dark:text-teal-400">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight text-slate-900 dark:text-slate-100 flex items-center gap-2">
                    Board TDA
                </h1>
                <p class="text-[11px] text-teal-600 dark:text-teal-400 flex items-center gap-1 font-medium">
                    <span class="w-1.5 h-1.5 rounded-full bg-teal-500 dark:bg-teal-400 inline-block"></span>Proyectos FZ
                </p>
            </div>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2">
            <!-- Dark / Light Toggle -->
            <button id="themeToggle" class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 transition-colors" title="Cambiar Tema">
                <i data-lucide="moon" class="w-3.5 h-3.5 dark-icon"></i>
                <i data-lucide="sun" class="w-3.5 h-3.5 light-icon hidden"></i>
            </button>

            <!-- Widget de reloj -->
            <div class="hidden sm:flex flex-col items-end px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/60 text-right">
                <span id="liveClock" class="text-xs font-mono font-semibold text-teal-700 dark:text-teal-300">00:00:00</span>
                <span id="liveDate" class="text-[9px] text-slate-500 dark:text-slate-400 uppercase tracking-wider">--,--</span>
            </div>

            <!-- Botón de Catálogo / Tienda de Proyectos -->
            <button id="openCatalogBtn" class="flex items-center gap-1 px-2.5 h-7 rounded-full bg-teal-500/10 hover:bg-teal-500/20 border border-teal-500/30 text-teal-600 dark:text-teal-400 text-[11px] shadow-sm font-semibold transition-colors cursor-pointer" title="Apps Disponibles">
                <i data-lucide="store" class="w-3.5 h-3.5"></i>
                <span>Catálogo</span>
            </button>

            <!-- Botón proyecto nuevo manual -->
            <button id="openAddModalBtn" class="flex items-center gap-1 px-2.5 h-7 rounded-full bg-teal-500/10 border border-teal-500/30 text-teal-600 dark:text-teal-400  hover:bg-teal-500/20  text-[11px] shadow-sm font-semibold transition-colors cursor-pointer" title="Agregar personalizado">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">Nuevo</span>
            </button>
        </div>
    </header>

    <!-- Contenido principal del cuerpo -->
    <main class="flex-1 overflow-y-auto p-3 relative max-w-7xl mx-auto w-full space-y-3 flex flex-col">

        <!-- Barra de buscar -->
        <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 rounded-xl p-3 shadow-md flex flex-col sm:flex-row gap-2.5 items-center justify-between shrink-0">
            <div class="relative w-full sm:w-72">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Buscar en mis Apps..." 
                    class="w-full pl-9 pr-3 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700/50 text-xs text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-teal-500 transition-all font-medium">
            </div>
        </div>

        <!-- Dashboard Grid Layout -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3" id="projectsContainer"></div>

        <!-- Extra Useful Widgets Panel -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-1 shrink-0">
            <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 rounded-xl p-3 shadow-md md:col-span-3 flex flex-col justify-between">
                <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-200 dark:border-slate-700/60">
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="sticky-note" class="w-4 h-4 text-teal-600 dark:text-teal-400"></i>
                        <h3 class="text-xs font-bold text-slate-900 dark:text-slate-100 uppercase tracking-wider">Notas Rápidas & Pendientes</h3>
                    </div>
                    <span id="noteSavedBadge" class="text-[10px] text-teal-600 dark:text-teal-400 font-semibold opacity-0 transition-opacity">Guardado ✓</span>
                </div>
                <textarea id="quickNotes" placeholder="Escribe ideas o notas rápidas aquí..." 
                    class="w-full h-40 bg-slate-50 dark:bg-slate-900/40 rounded-lg p-2.5 text-x text-slate-800 dark:text-slate-200 placeholder-slate-400 border border-slate-200 dark:border-slate-700/50 focus:outline-none focus:border-teal-500 resize-none transition-all"></textarea>
            </div>
        </div> 
    </main>

    <!-- Modal: Catálogo / Tienda de Proyectos Predefinidos -->
    <div id="catalogModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-5 w-full max-w-2xl shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3 shrink-0">
                <div class="flex items-center gap-2 text-slate-900 dark:text-slate-100 font-bold text-base">
                    <i data-lucide="store" class="w-5 h-5 text-teal-500"></i>
                    <span>Catálogo de Apps Disponibles</span>
                </div>
                <button id="closeCatalogBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <p class="text-xs text-slate-500 dark:text-slate-400 shrink-0">
                Selecciona la App que deseas tener en tu panel principal:
            </p>

            <!-- Lista de items precargados -->
            <div id="catalogContainer" class="overflow-y-auto space-y-2 pr-1 flex-1"></div>

            <div class="pt-2 border-t border-slate-200 dark:border-slate-700 flex justify-end shrink-0">
                <button id="finishCatalogBtn" class="px-4 py-2 bg-teal-500/10 border border-teal-500/30 text-teal-600 dark:text-teal-400 rounded-lg hover:bg-teal-500/20 rounded-xl text-xs font-semibold shadow-md transition-all">
                    Listo
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Add / Edit Project Manual -->
    <div id="projectModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">
                <div class="flex items-center gap-2 text-slate-900 dark:text-slate-100 font-bold text-base" id="modalTitle">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-teal-500"></i>
                    <span>Agregar Proyecto</span>
                </div>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="projectForm" class="space-y-3">
                <input type="hidden" id="projectId">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1"> Nombre *</label>
                    <input type="text" id="projectTitle" required placeholder="Ej: Calculadora" 
                        class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-teal-500 font-medium">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">URL *</label>
                    <input type="text" id="projectUrl" required placeholder="  " 
                        class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-teal-500 font-medium">
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Categoría</label>
                        <select id="projectCategory" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-teal-500 font-medium">
                            <option value="pwa">N/A</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Icono (Emoji o Lucide)</label>
                        <input type="text" id="projectIcon" placeholder="🚀 o 'globe'" 
                            class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-teal-500 font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Descripción Breve</label>
                    <textarea id="projectDesc" rows="2" placeholder="Notas breves del proyecto..." 
                        class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-teal-500 resize-none font-medium"></textarea>
                </div>
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="projectEmbed" class="rounded bg-slate-50 dark:bg-slate-900 border-slate-300 dark:border-slate-700 text-teal-600 focus:ring-0" checked>
                    <label for="projectEmbed" class="text-xs font-medium text-slate-700 dark:text-slate-300"> Abrir en el Hub </label> 
                </div>
                <div class="pt-2 flex gap-2 justify-end">
                    <button type="button" id="cancelModalBtn" class="px-3.5 py-2 bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 rounded-xl hover:bg-red-500/20 font-semibold text-xs transition-colors">Cancelar</button>
                    <button type="submit" class="px-4 py-2 rounded-xl bg-teal-500/10 border border-teal-500/30 text-teal-600 dark:text-teal-400 rounded-lg hover:bg-teal-500/20 text-xs font-semibold shadow-md transition-colors">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmación para Eliminar Proyecto -->
    <div id="confirmDeleteModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-[10005] flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl text-center space-y-4">
            <div class="w-10 h-10 bg-rose-500/10 border border-rose-500/20 text-rose-500 rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="alert-triangle" class="w-5 h-5"></i>
            </div>
            <p class="text-xs font-semibold text-slate-700 dark:text-slate-200 leading-relaxed">
                ¿Seguro que deseas eliminar esta App de tu lista?
            </p>
            <div class="flex gap-2">
                <button onclick="cerrarConfirmacionEliminar()" class="flex-1 py-2 bg-teal-500/10 border border-teal-500/30 text-teal-600 dark:text-teal-400 rounded-lg hover:bg-teal-500/20 font-semibold text-xs transition-colors">
                    Cancelar
                </button>
                <button onclick="ejecutarEliminacionProyecto()" class="flex-1 py-2 bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 rounded-xl hover:bg-red-500/20 font-semibold text-xs transition-colors">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <!-- --- VISTA DESLIZANTE DE PANTALLA COMPLETA --- -->
    <div id="iframeModal" class="view-transition flex flex-col">
        <!-- Barra superior de navegación de la subpágina -->
        <div class="flex items-center justify-between px-4 py-3 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-md shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="cerrarIframeAnimado()" class="flex items-center gap-1.5 px-3 py-1.5 bg-teal-500/10 hover:bg-teal-500/20 border border-teal-500/30 text-teal-600 dark:text-teal-400 font-bold text-xs rounded-xl transition-colors cursor-pointer">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Volver al Hub</span>
                </button>
                <span id="iframeTitle" class="text-xs sm:text-sm font-bold text-slate-900 dark:text-white truncate max-w-[180px] sm:max-w-xs">Vista Previa</span> 
            </div>
            <a id="iframeExternalLink" href="#" target="_blank" class="text-xs text-slate-500 dark:text-slate-400 hover:text-teal-600 dark:hover:text-teal-400 flex items-center gap-1 font-semibold transition-colors">
                <span class="hidden sm:inline">Pestaña nueva</span> 
                <i data-lucide="external-link" class="w-4 h-4"></i> 
            </a>
        </div>
        <!-- Contenedor estricto del Iframe -->
        <div class="flex-1 w-full h-full bg-slate-900 relative">
            <iframe id="pwaIframe" class="w-full h-full border-0 block" src="about:blank"></iframe>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // Catálogo maestro de proyectos predefinidos precargados
        const PREDEFINED_CATALOG = [
            {
                id: 'ventas_diarias',
                title: 'Ventas Diarias',
                url: 'ventas.html',
                category: 'pwa',
                icon: 'banknote-arrow-down',
                desc: 'Seguimiento a Ventas Diarias y Presupuesto Semanal.',
                embed: true
            },
            {
                id: 'corte_cajas',
                title: 'Corte de Cajas',
                url: 'corte.html',
                category: 'utilidad',
                icon: 'circle-dollar-sign',
                desc: 'Corte de cajas que se realiza todos los dias al cierre de tienda.',
                embed: true
            },
            {
                id: 'consultor_fases',
                title: 'Consultor de Fases',
                url: 'fases/',
                category: 'pwa',
                icon: 'list-ordered',
                desc: 'Consulta las Fases, Fases SALE y los articulos en cada una de ellas.',
                embed: true
            },
            {
                id: 'consultor_existencias',
                title: 'Consultor de Existencias',
                url: 'existencias.html',
                category: 'utilidad',
                icon: 'blocks',
                desc: 'Consulta las Existenciasde un artículo,  requeire archivo de Inventario para la Base se Datos.',
                embed: true
            },
            
        ];

        // Cargar o inicializar proyectos del usuario
        let projects = JSON.parse(localStorage.getItem('fzboard_projects'));
        
        if (!projects) {
            projects = [...PREDEFINED_CATALOG];
            localStorage.setItem('fzboard_projects', JSON.stringify(projects));
        }

        let activeCategory = 'all';
        let deferredPrompt = null;
        let projectToDeleteId = null;

        function formatUrl(url) {
            if (!url) return '#';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            return url;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProjects();
            initClock();
            initNotes();
            initTheme();
            initPwaInstaller();
            initCatalogModal();
            lucide.createIcons();
        });

        // Renderizado del Tablero de Proyectos Activos
        function renderProjects() {
            const container = document.getElementById('projectsContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = projects.filter(p => {
                const matchesCat = activeCategory === 'all' || p.category === activeCategory;
                const matchesSearch = p.title.toLowerCase().includes(searchTerm) || 
                                     (p.desc && p.desc.toLowerCase().includes(searchTerm));
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full p-8 text-center bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 rounded-xl shadow-md">
                        <i data-lucide="folder-open" class="w-10 h-10 text-slate-400 mx-auto mb-2"></i>
                        <p class="text-sm font-bold text-slate-800 dark:text-slate-200">No se encontraron aplicaciones guardadas.</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Usa el menú "Catálogo" para agregar una App a tu panel principal.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = filtered.map(p => {
                const formattedUrl = formatUrl(p.url);
                const isEmoji = p.icon && p.icon.match(/\p{Extended_Pictographic}/u);
                
                return `
                    <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 rounded-xl p-3 shadow-md flex flex-col justify-between group hover:border-teal-500/50 transition-all duration-200">
                        <div>
                            <div class="flex items-start justify-between mb-2">
                                <div class="w-9 h-9 rounded-lg bg-teal-500/10 border border-teal-500/20 flex items-center justify-center text-teal-600 dark:text-teal-400">
                                    ${isEmoji ? `<span class="text-lg">${p.icon}</span>` : `<i data-lucide="${p.icon || 'globe'}" class="w-4 h-4"></i>`}
                                </div>
                                <div class="flex items-center gap-1">
                  <!--                <button onclick="editProject('${p.id}')" class="p-1 rounded-lg text-slate-400 hover:text-teal-600 dark:hover:text-teal-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" title="Editar"> 
                                        <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                                    </button> -->
                                  <button onclick="deleteProject('${p.id}')" class="p-1 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" title="Eliminar">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    </button> 
                                </div>
                            </div>
                            <h3 class="text-base font-bold text-slate-900 dark:text-slate-100 group-hover:text-teal-600 dark:group-hover:text-teal-400 transition-colors truncate">${p.title}</h3>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-snug">${p.desc || 'Sin descripción'}</p>
                        </div>
                        <div class="pt-2.5 mt-2.5 border-t border-slate-200 dark:border-slate-700/60 flex items-center justify-between">
                            ${p.embed ? `
                                <button onclick="openIframeAnimado('${formattedUrl}', '${p.title.replace(/'/g, "\\'")}')" class="w-full py-1.5 rounded-lg bg-teal-500/10 hover:bg-teal-500/20 text-teal-600 dark:text-teal-400 border border-teal-500/30 text-xs shadow-sm font-semibold flex items-center justify-center gap-1.5 transition-colors cursor-pointer">
                                    <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i> Abrir App
                                </button>
                            ` : `
                                <a href="${formattedUrl}" target="_blank" class="w-full py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors shadow-sm">
                                    <span>Abrir Pestaña</span>
                                    <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
                                </a>
                            `}
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // --- SISTEMA DE CATÁLOGO / TIENDA PREDEFINIDA ---
        function initCatalogModal() {
            const catalogModal = document.getElementById('catalogModal');
            const openCatalogBtn = document.getElementById('openCatalogBtn');
            const closeCatalogBtn = document.getElementById('closeCatalogBtn');
            const finishCatalogBtn = document.getElementById('finishCatalogBtn');

            openCatalogBtn.addEventListener('click', () => {
                renderCatalogList();
                catalogModal.classList.remove('hidden');
            });

            closeCatalogBtn.addEventListener('click', () => catalogModal.classList.add('hidden'));
            finishCatalogBtn.addEventListener('click', () => catalogModal.classList.add('hidden'));
        }

        function renderCatalogList() {
            const catalogContainer = document.getElementById('catalogContainer');
            
            catalogContainer.innerHTML = PREDEFINED_CATALOG.map(item => {
                const isAdded = projects.some(p => p.id === item.id);
                const isEmoji = item.icon && item.icon.match(/\p{Extended_Pictographic}/u);

                return `
                    <div class="flex items-center justify-between p-3 rounded-xl border border-slate-200 dark:border-slate-700/70 bg-slate-50 dark:bg-slate-900/40 hover:border-teal-500/40 transition-all">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-lg bg-teal-500/10 border border-teal-500/20 flex items-center justify-center text-teal-600 dark:text-teal-400 shrink-0">
                                ${isEmoji ? `<span class="text-lg">${item.icon}</span>` : `<i data-lucide="${item.icon || 'globe'}" class="w-4 h-4"></i>`}
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-slate-900 dark:text-slate-100">${item.title}</h4>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-1">${item.desc}</p>
                            </div>
                        </div>
                        <button onclick="toggleCatalogProject('${item.id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all shrink-0 ${
                            isAdded 
                            ? 'bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 hover:bg-rose-500/20' 
                            : 'bg-teal-500/10 border border-teal-500/30 text-teal-600 dark:text-teal-400 rounded-lg hover:bg-teal-500/20 shadow-sm'
                        }">
                            ${isAdded ? 'Quitar' : 'Añadir'}
                        </button>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        window.toggleCatalogProject = (catId) => {
            const exists = projects.some(p => p.id === catId);
            if (exists) {
                projects = projects.filter(p => p.id !== catId);
            } else {
                const item = PREDEFINED_CATALOG.find(c => c.id === catId);
                if (item) projects.push({...item});
            }
            
            localStorage.setItem('fzboard_projects', JSON.stringify(projects));
            renderCatalogList();
            renderProjects();
        };

        // Reloj en tiempo real
        function initClock() {
            const updateClock = () => {
                const now = new Date();
                const clockEl = document.getElementById('liveClock');
                const dateEl = document.getElementById('liveDate');
                if (clockEl) clockEl.textContent = now.toLocaleTimeString();
                if (dateEl) dateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
            };
            updateClock();
            setInterval(updateClock, 1000);
        }

        // Notas Rápidas con guardado automático
        function initNotes() {
            const textarea = document.getElementById('quickNotes');
            const badge = document.getElementById('noteSavedBadge');
            textarea.value = localStorage.getItem('fzboard_notes') || '';

            let timeout;
            textarea.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    localStorage.setItem('fzboard_notes', textarea.value);
                    badge.classList.remove('opacity-0');
                    setTimeout(() => badge.classList.add('opacity-0'), 1500);
                }, 500);
            });
        }

        // Cambio de Modo Claro / Oscuro
        const btnThemeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        function setTheme(isDark) {
            if (isDark) {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
            lucide.createIcons();
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            setTheme(savedTheme !== 'light');

            btnThemeToggle.addEventListener('click', () => {
                const isDarkActive = htmlElement.classList.contains('dark');
                setTheme(!isDarkActive);
            });
        }

        // Modal de Creación / Edición Manual
        const modal = document.getElementById('projectModal');
        const form = document.getElementById('projectForm');

        document.getElementById('openAddModalBtn').addEventListener('click', () => {
            form.reset();
            document.getElementById('projectId').value = '';
            document.getElementById('modalTitle').innerHTML = '<i data-lucide="plus-circle" class="w-5 h-5 text-teal-500"></i><span>Agregar</span>';
            modal.classList.remove('hidden');
            lucide.createIcons();
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.add('hidden'));
        document.getElementById('cancelModalBtn').addEventListener('click', () => modal.classList.add('hidden'));

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('projectId').value || Date.now().toString();
            const newProject = {
                id,
                title: document.getElementById('projectTitle').value,
                url: document.getElementById('projectUrl').value,
                category: document.getElementById('projectCategory').value,
                icon: document.getElementById('projectIcon').value || 'globe',
                desc: document.getElementById('projectDesc').value,
                embed: document.getElementById('projectEmbed').checked
            };

            const index = projects.findIndex(p => p.id === id);
            if (index > -1) {
                projects[index] = newProject;
            } else {
                projects.unshift(newProject);
            }

            localStorage.setItem('fzboard_projects', JSON.stringify(projects));
            modal.classList.add('hidden');
            renderProjects();
        });

        window.editProject = (id) => {
            const p = projects.find(item => item.id === id);
            if (!p) return;

            document.getElementById('projectId').value = p.id;
            document.getElementById('projectTitle').value = p.title;
            document.getElementById('projectUrl').value = p.url;
            document.getElementById('projectCategory').value = p.category;
            document.getElementById('projectIcon').value = p.icon;
            document.getElementById('projectDesc').value = p.desc;
            document.getElementById('projectEmbed').checked = p.embed;

            document.getElementById('modalTitle').innerHTML = '<i data-lucide="pencil" class="w-5 h-5 text-teal-500"></i><span>Editar Proyecto</span>';
            modal.classList.remove('hidden');
            lucide.createIcons();
        };

        window.deleteProject = (id) => {
            projectToDeleteId = id;
            document.getElementById('confirmDeleteModal').classList.remove('hidden');
            lucide.createIcons();
        };

        function cerrarConfirmacionEliminar() {
            projectToDeleteId = null;
            document.getElementById('confirmDeleteModal').classList.add('hidden');
        }

        function ejecutarEliminacionProyecto() {
            if (projectToDeleteId) {
                projects = projects.filter(p => p.id !== projectToDeleteId);
                localStorage.setItem('fzboard_projects', JSON.stringify(projects));
                renderProjects();
            }
            cerrarConfirmacionEliminar();
        }

        document.getElementById('searchInput').addEventListener('input', renderProjects);

        // Control de vista desglosable (Iframe)
        window.openIframeAnimado = (url, title) => {
            const viewModal = document.getElementById('iframeModal');
            const iframe = document.getElementById('pwaIframe');
            
            document.getElementById('iframeTitle').textContent = title;
            document.getElementById('iframeExternalLink').href = url;
            
            if (iframe.src !== url && !iframe.src.endsWith(url)) {
                iframe.src = url;
            }

            viewModal.classList.add('active');
        };

        window.cerrarIframeAnimado = () => {
            const viewModal = document.getElementById('iframeModal');
            viewModal.classList.remove('active');
        };

        // Hook de instalación de PWA
        function initPwaInstaller() {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
            });
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Registration error:', err));
            });
        }
    </script>
</body>
</html>
